name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: gcc-12
  CXX: g++-12

jobs:
  build:
    name: Build / Linux executable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      executable-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-12

      - name: Build with warnings as errors and package the executable
        id: package
        run: |
          out="$RUNNER_TEMP/dhcomply-bin"
          make -B -j2 all CC="$CC" BINDIR="$out" WERROR=1
          test -x "$out/dhcomply"
          test -x "$out/check_dad.sh"
          sha256sum "$out/dhcomply" | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
          tar -czf "$RUNNER_TEMP/dhcomply-linux-x86_64.tar.gz" -C "$out" dhcomply check_dad.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dhcomply-linux-x86_64
          path: ${{ runner.temp }}/dhcomply-linux-x86_64.tar.gz
          if-no-files-found: error

  verify-executable:
    name: Verify / Executable identity
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dhcomply-linux-x86_64

      - name: Compare packaged executable with build output
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.executable-sha256 }}
        run: |
          tar -xOzf dhcomply-linux-x86_64.tar.gz dhcomply > dhcomply
          printf '%s  dhcomply\n' "$EXPECTED_SHA256" | sha256sum --strict --check

      - name: Sign executable provenance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: provenance
        uses: actions/attest@v4
        with:
          subject-name: dhcomply
          subject-digest: sha256:${{ needs.build.outputs.executable-sha256 }}

      - name: Verify signature against workflow and commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh attestation verify dhcomply --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA"

  verify-version:
    name: Verify / Version smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dhcomply-linux-x86_64
          path: ${{ runner.temp }}
      - name: Run the packaged executable and check its version
        shell: bash
        run: |
          version=$(sed -nE 's/^#define DHCOMPLY_CURRENT_VERSION "([^"]+)".*/\1/p' src/dhcomplyStandardLibraryConstants.h)
          test -n "$version"
          cd "$RUNNER_TEMP"
          tar -xzf dhcomply-linux-x86_64.tar.gz dhcomply
          status=0
          timeout --kill-after=2s 10s ./dhcomply V > actual-version.txt || status=$?
          # The version command explicitly calls exit(-1), which Linux reports as 255.
          if [[ $status != 255 ]]; then
            echo "::error::Version command exited with status $status (expected 255)"
            exit 1
          fi
          diff -u <(printf '%s\n' "$version") actual-version.txt
          cat actual-version.txt

  unit-tests:
    name: Testing / Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-12 g++-12 libgtest-dev ninja-build

      - name: Build instrumented tests
        run: |
          cmake -S . -B build/ci -G Ninja -DDHCOMPLY_ENABLE_COVERAGE=ON
          cmake --build build/ci --parallel 2

      - name: Run GoogleTest and trace the DAD script
        shell: bash
        run: |
          mkdir -p reports/gcov
          export DAD_TRACE="$PWD/reports/dad.trace"
          cat > "$RUNNER_TEMP/trace-dad.bash" <<'EOF'
          exec 9>>"$DAD_TRACE"
          BASH_XTRACEFD=9
          PS4='+ ${BASH_SOURCE}:${LINENO}: '
          set -x
          EOF
          BASH_ENV="$RUNNER_TEMP/trace-dad.bash" ctest --test-dir build/ci \
            --no-tests=error --output-on-failure --output-junit "$PWD/reports/junit.xml"

      - name: Require full C line and branch coverage
        shell: bash
        run: |
          root=$PWD
          cd reports/gcov
          for source in "$root"/src/*.c; do
            file=${source##*/}
            mapfile -t objects < <(find "$root/build/ci/CMakeFiles" -path "*/src/$file.gcno")
            [[ ${#objects[@]} == 1 ]] || { echo "Missing or ambiguous coverage for $file"; exit 1; }
            gcov-12 -b -c "${objects[0]}"
            test -s "$file.gcov"
            awk '/^[[:space:]]*(#####|=====):/ || /^branch / && ($3 == "never" || $4 == "0") {
                   print FILENAME ": " $0; missed = 1
                 } END { exit missed }' "$file.gcov"
          done

      - name: Require full DAD script line coverage
        shell: bash
        run: |
          awk '/^[[:space:]]*($|#|fi$|done$)/ {next} {print NR}' src/check_dad.sh > reports/dad-expected.txt
          sed -nE 's/^\++ .*\/src\/check_dad\.sh:([0-9]+):.*$/\1/p' reports/dad.trace \
            | sort -nu > reports/dad-covered.txt
          diff -u reports/dad-expected.txt reports/dad-covered.txt

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn

  integration-tests:
    name: Testing / DHCPv6 integration
    needs: [verify-executable, verify-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dhcomply-linux-x86_64
          path: ${{ runner.temp }}
      - name: Build integration test image
        run: |
          docker build -t dhcomply-integration - <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
              python3 iproute2 sudo \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: Run all integration checks five times
        shell: bash
        run: |
          mkdir -p integration-results "$RUNNER_TEMP/dhcomply-bin"
          tar -xzf "$RUNNER_TEMP/dhcomply-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/dhcomply-bin"
          status=0
          for repetition in 1 2 3 4 5; do
            echo "::group::Integration run $repetition of 5"
            results="$PWD/integration-results/run-$repetition"
            mkdir -p "$results"
            if ! docker run --rm --network none --cap-add NET_ADMIN \
              -v "$PWD:/src:ro" -v "$results:/results" \
              -v "$RUNNER_TEMP/dhcomply-bin:/client:ro" \
              -w /src/test/DHCPv6/DHCPv6-Integration-Tests dhcomply-integration \
              python3 -B ci_run.py --binary /client/dhcomply --evidence /results \
                --lab-evidence "ci-evidence/$repetition"; then
              echo "::error::Integration run $repetition failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: integration-results
          path: integration-results/
          if-no-files-found: warn

  megalinter:
    name: Linting / MegaLinter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint build definitions
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$PR_BASE" ]] || ! git diff --quiet "$PR_BASE"...HEAD -- CMakeLists.txt; then
            pipx run --spec cmakelint cmakelint CMakeLists.txt
          fi
          if [[ -z "$PR_BASE" ]] || ! git diff --quiet "$PR_BASE"...HEAD -- Makefile; then
            go run github.com/checkmake/checkmake/cmd/checkmake@v0.3.2 Makefile
          fi

      - uses: oxsecurity/megalinter@v10.2.0
        if: ${{ !cancelled() }}
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: 'true'
          APPLY_FIXES: none
          FILTER_REGEX_EXCLUDE: '(^|/)(build|bin|lib/cJSON\.[ch])(/|$)'
          GITHUB_COMMENT_REPORTER: 'false'
          GITHUB_STATUS_REPORTER: 'false'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: megalinter-reports
          path: megalinter-reports/
          if-no-files-found: warn

  sonarqube:
    name: Smelling / SonarQube Quality Gate
    needs: unit-tests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate compilation database on the scanner runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-12 g++-12 libgtest-dev ninja-build
          cmake -S . -B build/ci -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports

      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.tests=test/DHCPv6/DHCPv6-Unit-Tests/src
            -Dsonar.cfamily.compile-commands=build/ci/compile_commands.json
            -Dsonar.cfamily.gcov.reportsPath=reports/gcov
            -Dsonar.qualitygate.wait=true
